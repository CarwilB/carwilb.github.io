project: 
  type: website
  output-dir: docs
  resources: 
    - images/*
    - private/*
    
pagetitle: "{{< meta title >}} | Carwil Bjork-James"
    
execute:
  freeze: auto    

website: 
  page-navigation: true
  title: "Carwil Bjork-James"
  site-url: https://carwilb.github.io/ 
  favicon: favicon.ico
  
  page-footer:
    right:
      - icon: rss
        href: index.xml
        aria-label: RSS Feed
    left: "Carwil Bjork-James's research, teaching, and data science website"
    
  sidebar:
    logo: "images/carwil-bjork-james-hex.png"
    logo-alt: "Carwil Bjork-James in a data science hexagon"
    title: "Carwil Bjork-James"
    subtitle: "Research notes on violence, human rights, social movements, and open data"
    pinned: true
    align: center
    tools: 
      - icon: globe
        href: https://ultimateconsequences.github.io
        text: "Ultimate Consequences Project Website"
      - icon: wordpress
        href: https://woborders.blog
        text: "Carwil without Borders"
      - icon: mastodon
        href: https://mastodon.online/@Carwil
        text: "Carwil on Mastodon"
      - icon: twitter
        href: https://twitter.com/CarwilBJ
        text: "Carwil Bjork-James on Twitter" 
      - icon: twitter
        href: https://carwilb.github.io/twitter
        text: "Twitter archive" 
    style: "docked"
    search: true
    collapse-level: 1
    contents:
      - href: index.qmd
        text: Welcome
      - text: "---"
      - href: about-bio.qmd
        text: "Biography"
      - text: "---"
      - href: index.qmd#posts
        text: Posts
        sort: "date desc" # Ensure this is aligned with 'contents' or under the section
        contents: posts/**/*.qmd
      - href: index.qmd#teaching-notes
        text: Teaching Notes
        sort: "date desc" # Ensure this is aligned with 'contents' or under the section
        contents: teaching/*
      - href: talks.qmd
        text: Talks and Presentations
        sort: "date desc" # Ensure this is aligned with 'contents' or under the section
        contents: talks/*
      - href: pubs.qmd
        text: Publications
        sort: "date desc" # Ensure this is aligned with 'contents' or under the section
        contents: pubs/*
      - text: "---"
      - section: "Tools"
        collapsed: false
        contents:
          - href: tools/wiki-to-ris.html
            text: "Wikipedia → RIS"
          - href: tools/bolivia-muni-infobox-en.html
            text: "Bolivia municipality infoboxes"
          - href: tools/bolivia-muni-generator-en.html
            text: "Bolivia municipality article content"
          - href: tools/us-aa-census-wikitext.qmd
            text: "African Americans by state wikitext"
      - text: "---"
      - section: "Wiki Automation"
        href: wiki-automation/index.qmd
        collapsed: true
        contents:
          - href: wiki-automation/bolivia-muni-infobox-en.html
            text: "Municipality Infoboxes (EN)"
          - href: wiki-automation/bolivia-muni-generator-en.html
            text: "Municipality Article Content (EN)"
          - href: wiki-automation/bolivia-muni-generator-es.html
            text: "Tablas del Concejo Municipal (ES)"
          - href: wiki-automation/cpv2024-population-quickstatements.html
            text: "CPV 2024 Population QuickStatements"
          - href: wiki-automation/bo-muni-flag-coat-wikidata-review.html
            text: "Flag & Coat of Arms Review"
          - href: wiki-automation/pcode-crosswalk.html
            text: "Wikidata QID ↔ Pcode Crosswalk"
          - href: wiki-automation/locator-maps-process.html
            text: "Municipal Locator Maps"
          - href: wiki-automation/bolivia-wikipedia-completeness.html
            text: "Wikipedia Coverage by Language"
          - href: wiki-automation/bolivia-municipality-wikipedia.html
            text: "Bolivia Municipality Wikipedia Pages"
          - href: wiki-automation/wiki-cleanup-bolivia-municipalities.html
            text: "Cleanup Tracker"            
    footer: |
      <div style="text-align: center; padding: 0.5em 0;">
        <img src="https://hitscounter.dev/api/hit?url=https%3A%2F%2Fcarwilb.github.io&label=Pageviews&icon=github&color=%230f5132&message=&style=flat&tz=UTC"
             alt="Visit counter" />
      </div>

format:
  html:
    theme: 
      light: cosmo
      dark: slate
    mainfont: "Source Sans Pro"
    code-copy: true
    code-overflow: wrap
    toc: false
    citation-style: csl/chicago-notes.csl
    link-citations: false
    pagetitle: "{{< meta title >}}"
    include-in-header: 
      - text: '<meta name="google-site-verification" content="oYAivVKE7UFgQ66hZw62En45B3ax7yay-PnLASmXZoM" />'


filters:
  - include-files.lua
 
  
